services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-production
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=development
      - PORT=3001
      - JWT_SECRET=dev-secret-key
      - DATABASE_URL=file:./prisma/dev.db
    volumes:
      - ./packages/api:/app/packages/api
      - ./packages/shared:/app/packages/shared
      - api-data:/app/packages/api/prisma
    restart: unless-stopped
    command: >
      sh -c "cd packages/api && npx prisma db push --skip-generate && cd /app && node packages/api/dist/index.js"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-builder
    ports:
      - '5173:5173'
    environment:
      - VITE_API_URL=http://localhost:3001
    volumes:
      - ./packages/web:/app/packages/web
      - ./packages/shared:/app/packages/shared
    restart: unless-stopped
    command: npm run dev -w packages/web

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  api-data:
    driver: local
