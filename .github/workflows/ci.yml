name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Run Biome Lint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./packages/api/prisma/dev.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Setup database
        run: |
          npm run db:generate
          npm run db:push
          npm run db:seed

      - name: Run frontend tests
        run: npm run test:web

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build packages
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: api-production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ojt-log-api:${{ github.sha }}

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: web-production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ojt-log-web:${{ github.sha }}

  smoke:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    needs: [docker]
    env:
      # Provide a strong secret locally to satisfy the API boot guards
      # (in production this MUST be set via the host environment, never baked in)
      JWT_SECRET: 'ci-smoke-test-secret-not-for-production-use-32+chars'
      CORS_ORIGINS: 'http://localhost,http://localhost:80'
    steps:
      - uses: actions/checkout@v4

      - name: Build compose images
        run: docker compose build

      - name: Start stack in background
        run: |
          docker compose up -d
          docker compose ps

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/health >/dev/null; then
              echo "API ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start in time"
          echo "--- api logs ---"
          docker compose logs api || true
          echo "--- api container status ---"
          docker compose ps api || true
          exit 1

      - name: Wait for Web health
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:80 || true)
            if [ "$code" = "200" ]; then
              echo "Web ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Web failed to start in time"
          docker compose logs web
          exit 1

      - name: API returns healthy + sets security headers
        run: |
          headers=$(curl -sI http://localhost:3001/health)
          echo "$headers"
          echo "$headers" | grep -i '^content-security-policy:' >/dev/null
          echo "$headers" | grep -i '^x-content-type-options: nosniff' >/dev/null
          echo "$headers" | grep -i '^x-frame-options: deny' >/dev/null
          echo "$headers" | grep -i '^cross-origin-opener-policy: same-origin' >/dev/null

      - name: API CORS rejects unknown origins
        run: |
          # Forbidden origin should NOT receive Access-Control-Allow-Origin
          out=$(curl -sI -H 'Origin: https://evil.example' http://localhost:3001/health || true)
          echo "$out"
          if echo "$out" | grep -i '^access-control-allow-origin: https://evil.example' >/dev/null; then
            echo "ERROR: evil origin was accepted by CORS"
            exit 1
          fi

      - name: Web SPA fallback works for deep-links
        run: |
          # Deep link that requires the SPA fallback (no /log/abc.html file exists)
          body=$(curl -s http://localhost:80/log/abc-123)
          echo "$body" | grep -i '<title>' | head -1
          echo "$body" | grep -i '/assets/' >/dev/null

      - name: Tear down stack
        if: always()
        run: docker compose down -v
