services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-production
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set (>=16 chars, not the placeholder)}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
      - DATABASE_URL=file:./dev.db
    volumes:
      - api-data:/app/packages/api/prisma
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3001/health']
      interval: 30s
      timeout: 3s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-production
    ports:
      - '80:80'
    # Web depends on API being ready before nginx starts
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:80']
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  api-data:
    driver: local
