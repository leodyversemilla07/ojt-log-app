services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-production
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set (>=16 chars, not the placeholder)}
      - DATABASE_URL=file:./prisma/dev.db
    volumes:
      - api-data:/app/packages/api/prisma
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3001/health']
      interval: 30s
      timeout: 3s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-production
    ports:
      - '80:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:80']
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  api-data:
    driver: local
